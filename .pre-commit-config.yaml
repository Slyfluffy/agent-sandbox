repos:
  - repo: local
    hooks:
      - id: dockerfile-lint
        name: Dockerfile Lint
        entry: hadolint
        language: system
        files: Dockerfile
  - repo: https://github.com/reteps/dockerfmt
    rev: v0.6.0  # run `pre-commit autoupdate` to pin a version
    hooks:
      - id: dockerfmt
